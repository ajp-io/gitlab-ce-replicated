apiVersion: kots.io/v1beta1
kind: Application
metadata:
  name: gitlab-community-edition
spec:
  title: GitLab Community Edition
  statusInformers:
    # Core GitLab components
    - deployment/gitlab-webservice-default
    - service/gitlab-webservice-default
    - deployment/gitlab-sidekiq-all-in-1-v2
    - statefulset/gitlab-gitaly
    - service/gitlab-gitaly
    - deployment/gitlab-gitlab-shell
    - deployment/gitlab-toolbox
    - job/gitlab-migrations-1

    # Container Registry (when enabled)
    - '{{repl if (ConfigOptionEquals "container_registry_enabled" "1") }}deployment/gitlab-registry{{repl end}}'
    - '{{repl if (ConfigOptionEquals "container_registry_enabled" "1") }}service/gitlab-registry{{repl end}}'

    # GitLab Runner (when enabled)
    - '{{repl if (ConfigOptionEquals "gitlab_runner_enabled" "1") }}deployment/gitlab-runner{{repl end}}'

    # Database components (only when database_type = embedded)
    - '{{repl if (ConfigOptionEquals "database_type" "embedded") }}statefulset/gitlab-postgresql{{repl end}}'
    - '{{repl if (ConfigOptionEquals "database_type" "embedded") }}service/gitlab-postgresql{{repl end}}'

    # Redis components (always deployed)
    - statefulset/gitlab-redis-master
    - service/gitlab-redis-master

    # MinIO components (always deployed)
    - deployment/gitlab-minio
    - service/gitlab-minio

    # Replicated SDK components
    - deployment/replicated
    - service/replicated

    # Embedded Cluster extensions
    - '{{repl if (eq Distribution "embedded-cluster") }}deployment/ingress-nginx-controller{{repl end}}'
    - '{{repl if (eq Distribution "embedded-cluster") }}service/ingress-nginx-controller{{repl end}}'
    - '{{repl if (eq Distribution "embedded-cluster") }}deployment/cert-manager{{repl end}}'
    - '{{repl if (eq Distribution "embedded-cluster") }}deployment/cert-manager-cainjector{{repl end}}'
    - '{{repl if (eq Distribution "embedded-cluster") }}deployment/cert-manager-webhook{{repl end}}'

  ports:
    - serviceName: "gitlab-webservice-default"
      servicePort: 8080
      localPort: 30001
      applicationUrl: "http://gitlab-webservice-default"
  icon: https://about.gitlab.com/images/press/logo/png/gitlab-icon-rgb.png
